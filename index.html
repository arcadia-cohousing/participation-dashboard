<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arcadia Participation Dashboard — sign in</title>
<style>
  :root { --ink:#1d1d1b; --soft:#555; --bg:#f7f7f5; --panel:#fff; --border:#d8d6d0; --accent:#2f6b3e; --warn:#b34a26; }
  html, body { height: 100%; margin: 0; }
  body { font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
         color: var(--ink); background: var(--bg); display: flex; align-items: center; justify-content: center; }
  .box { background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
         padding: 28px 32px; width: 100%; max-width: 380px; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
  h1 { font-size: 19px; margin: 0 0 4px; }
  p.sub { color: var(--soft); margin: 0 0 18px; font-size: 13px; }
  label.field { display: block; font-size: 12px; color: var(--soft); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .04em; }
  input[type=password] { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 5px; font: inherit; box-sizing: border-box; }
  input[type=password]:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
  .row { display: flex; align-items: center; margin: 12px 0 16px; font-size: 13px; color: var(--soft); }
  .row input { margin-right: 6px; }
  button { width: 100%; padding: 10px 14px; border: 1px solid var(--accent); background: var(--accent); color: #fff;
           border-radius: 5px; font: inherit; font-weight: 600; cursor: pointer; }
  button:hover { filter: brightness(.95); }
  button:disabled { opacity: .6; cursor: progress; }
  .err { color: var(--warn); font-size: 13px; margin-top: 12px; min-height: 1.2em; }
  .hint { color: var(--soft); font-size: 12px; margin-top: 18px; text-align: center; }
</style>
</head>
<body>
<form id="f" class="box" autocomplete="off">
  <h1>Arcadia Participation Dashboard</h1>
  <p class="sub">Enter the dashboard password to view.</p>
  <label class="field" for="pw">Password</label>
  <input type="password" id="pw" autofocus required>
  <label class="row"><input type="checkbox" id="remember"> Remember on this device</label>
  <button type="submit" id="go">Unlock</button>
  <div class="err" id="err">&nbsp;</div>
  <div class="hint">If you've lost the password, contact Arcadia IT.</div>
</form>

const ITERATIONS = 600000;
const STORAGE_KEY = "arcadia-dash-pw";

async function decrypt(b64, password) {
  const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const salt = bin.slice(0, 16); const iv = bin.slice(16, 28); const ct = bin.slice(28);
  const baseKey = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name:"PBKDF2", salt, iterations: ITERATIONS, hash:"SHA-256" },
    baseKey, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv }, key, ct);
  return new TextDecoder().decode(pt);
}

async function unlock(password, persist) {
  const btn = document.getElementById("go"); const err = document.getElementById("err");
  btn.disabled = true; err.textContent = "Decrypting…";
  try {
    const html = await decrypt(ENCRYPTED, password);
    if (persist === "session") sessionStorage.setItem(STORAGE_KEY, password);
    if (persist === "device")  localStorage.setItem(STORAGE_KEY, password);
    document.open(); document.write(html); document.close();
    return true;
  } catch (e) {
    btn.disabled = false; err.textContent = "Incorrect password.";
    document.getElementById("pw").select();
    sessionStorage.removeItem(STORAGE_KEY);
    return false;
  }
}

(async () => {
  const saved = localStorage.getItem(STORAGE_KEY) || sessionStorage.getItem(STORAGE_KEY);
  if (saved) { await unlock(saved, null); }
})();

document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const pw = document.getElementById("pw").value;
  const remember = document.getElementById("remember").checked;
  await unlock(pw, remember ? "device" : "session");
});
</script>
